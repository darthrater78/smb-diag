name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # Publish rather than build: the csproj's single-file/self-contained settings
      # only take effect on publish, and that exe is what ships.
      - name: Publish
        run: dotnet publish --configuration Release --no-restore --output ./publish

      # Test artifact from this exact commit, for verifying a PR before merge.
      - name: Upload test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smb-diag-${{ github.sha }}
          path: publish/smb-diag.exe
          if-no-files-found: error
          retention-days: 14
