version: 2
updates:
  # Keeps workflow SHA pins and their version comments current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # The app has no PackageReferences; the unit tests have the test framework
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/tests/SmbDiag.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
